/* fonts:end */
:root{
  --paper:#FBFBF9; --ink:#111214; --graphite:#55585E; --hair:#C8C9CC; --wash:#F0F0ED; --accent:#1E3FD8; --on-accent:#FBFBF9; --accent-light:#8FA3FF; --up:#0A7D3E; --down:#C8102E;
  --sans:'Montserrat', 'Helvetica Neue', Arial, sans-serif;
  --mono:'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@page{size:A4;margin:0}
*{box-sizing:border-box}
html,body{margin:0;background:#E4E4E0}
body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
p{text-wrap:pretty}
.page{width:210mm;height:297mm;margin:24px auto;padding:44px 48px;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;overflow:hidden}
@media print{html,body{background:var(--paper)}.page{margin:0;break-after:page}.page:last-child{break-after:auto}}
.meta{font-family:var(--mono);font-size:12px;line-height:16px;color:var(--graphite)}
.ink{color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;gap:16px}
.tag{background:var(--accent);color:var(--on-accent);font-weight:600;padding:0 4px}
.kicker{align-self:flex-start;font-family:var(--mono);font-size:12px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;background:var(--accent);color:var(--on-accent)}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-bottom:8px;border-bottom:1px solid var(--ink);font-family:var(--mono);font-size:12px;line-height:16px}
.sechead .name{display:flex;gap:8px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.sechead .aside{color:var(--graphite)}

/* masthead */
.mast{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-top:14px}
.mast h1{font-size:84px;line-height:.9;font-weight:600;letter-spacing:-.045em;white-space:nowrap}
.cursor{display:inline-block;width:.4em;height:.72em;margin-left:.08em;background:var(--accent);vertical-align:-.03em}
.mast .issue{white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;gap:2px;padding-bottom:6px;text-align:right}
.band{display:flex;align-items:center;gap:14px;margin-top:14px;padding:8px 10px;background:var(--accent);color:var(--on-accent);font-family:var(--mono);font-size:12px;line-height:16px}
.band span{display:flex;gap:6px;white-space:nowrap}.band b{font-weight:700}
.band .sp{flex:1}

/* shared story blocks */
.sec{display:flex;flex-direction:column;min-height:0}
.grow{flex:1 1 auto}
.story h2{margin-top:10px;font-size:40px;line-height:1.06;font-weight:600;letter-spacing:-.02em}
.deck{margin-top:12px;font-size:19px;line-height:1.4;color:var(--graphite)}
.src{margin-top:12px}
.cols{margin-top:16px;padding-top:16px;border-top:1px solid var(--hair);flex:1 1 auto;min-height:0;overflow:hidden;column-count:2;column-gap:40px;column-rule:1px solid var(--hair);column-fill:auto}
.cols p{margin:0 0 12px}
.quote{column-span:all;break-inside:avoid;margin:4px 0 16px;padding:14px 16px;background:var(--accent);color:var(--on-accent);display:flex;flex-direction:column;gap:8px}
.quote p{margin:0;font-size:19px;line-height:1.3;font-weight:600;letter-spacing:-.01em}
.quote span{font-family:var(--mono);font-size:12px;line-height:16px;font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;column-gap:40px;min-height:0}
.card{display:flex;flex-direction:column;gap:6px;padding:16px 0;border-bottom:1px solid var(--hair);min-height:0;overflow:hidden}
.card h3{font-size:19px;line-height:1.22;font-weight:600;letter-spacing:-.01em}
.card p{font-size:15px;line-height:1.45}
.card .region{color:var(--ink);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.grid2 > .card:nth-last-child(-n+2){border-bottom:0}
.grid2 > .card:nth-child(-n+2){padding-top:12px}

/* page 1 */
.front{margin-top:24px;flex:1 1 auto}
.front .cols{font-size:15px;line-height:1.45}
.index{margin-top:18px}
.photo{margin:0 0 12px;break-inside:avoid}
.photo img{display:block;width:100%;aspect-ratio:1100/665;object-fit:cover;background:#000}
.photo figcaption{margin-top:5px;font-size:11px;line-height:14px}
.index .sechead{padding-bottom:6px}
.irow{display:grid;grid-template-columns:44px 120px minmax(0,1fr);column-gap:12px;align-items:baseline;padding:4px 0;border-bottom:1px solid var(--hair);font-size:15px;line-height:1.35}
.irow:last-child{border-bottom:0}
.irow .pg{font-family:var(--mono);font-size:12px;font-weight:600;justify-self:start;padding:1px 5px;background:var(--accent);color:var(--on-accent)}
.irow .sn{font-family:var(--mono);font-size:12px;color:var(--graphite);text-transform:uppercase;letter-spacing:.04em}
.irow .hl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* page 2 */
.briefs{margin-top:18px}
.radar{margin-top:20px}
.radar .card{gap:3px;padding:10px 0}
.radar .card h3{font-size:16px}
.radar .card p{font-size:14px;line-height:1.4;color:var(--graphite)}

/* Eight-page expansion reuses the paper's type, rules, accent and cards. */
.page.expanded .band{font-size:11px;gap:10px}
.page.expanded .irow{grid-template-columns:60px 110px minmax(0,1fr)}
.eight .front .cols,.eight .chip-lead .cols,.eight .explain .cols{font-size:15px;line-height:1.45}
.eight .companies .card{padding:12px 0}
.eight .companies .card p{font-size:14px;line-height:1.4}
.eight .companies .card{gap:5px}
.tech-expanded .briefs{flex:1 1 auto}
.tech-expanded .briefs .grid2{flex:1 1 auto;grid-template-rows:1fr}
.tech-expanded .briefs .card p{font-size:16px;line-height:1.5}
.tech-expanded .radar{margin-top:24px}
.tech-expanded .radar .grid2{grid-template-columns:repeat(3,minmax(0,1fr));column-gap:24px}
.tech-expanded .radar .card{border-bottom:0}
.chip-lead{margin-top:18px;flex:1 1 auto}
.chip-lead .kicker{margin-top:16px}
.chip-briefs{margin-top:20px;flex-shrink:0}
.chip-briefs .grid2{grid-template-columns:repeat(3,minmax(0,1fr));column-gap:24px}
.chip-briefs .card{border-bottom:0;padding:8px 0}
.chip-briefs .grid2 > .card:nth-child(-n+2){padding-top:8px}
.eight .chip-lead .cols{margin-top:12px;padding-top:12px;line-height:1.35;column-gap:24px}
.eight .chip-lead .kicker{margin-top:12px}
.eight .chip-lead .deck,.eight .chip-lead .src{margin-top:8px}
.chip-briefs .card h3{font-size:17px}
.chip-briefs .card p{font-size:14px;line-height:1.45}
/* p.3 AI page: the chips page's lead and briefing, plus a row of new models */
.ai-lead{margin-top:18px;flex:1 1 auto}
.ai-lead h2{margin-top:10px;font-size:36px}
.ai-lead .deck{font-size:18px}
.eight .ai-lead .cols{margin-top:10px;padding-top:10px;font-size:15px;line-height:1.4;column-gap:24px}
.eight .ai-lead .kicker{margin-top:12px}
.eight .ai-lead .deck,.eight .ai-lead .src{margin-top:8px}
.ai-models{margin-top:14px;flex-shrink:0}
/* Model watch: one row per model, capability icons explained by the legend below */
.mw{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.7fr) minmax(0,1fr);column-gap:16px}
.mw > *{padding:5px 0;border-bottom:1px solid var(--hair);align-self:stretch}
.mw .th{padding:6px 0 3px;border-bottom:0;font-family:var(--mono);font-size:10.5px;line-height:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--graphite)}
.mw .grp{padding:6px 0 3px;border-bottom:0;font-family:var(--mono);font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.mw .nm b{display:block;font-size:14.5px;line-height:1.25;font-weight:600}
.mw .nm > span{display:block;margin-top:1px;font-family:var(--mono);font-size:10.5px;line-height:14px;color:var(--graphite);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mw .sz{font-family:var(--mono);font-size:13px;line-height:1.3;font-weight:600}
.mw .sz small{display:block;font-size:10.5px;font-weight:400;color:var(--graphite)}
.mw .ic{display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;padding-top:6px}
.mw .row-last{border-bottom:0}
.cap{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;color:var(--accent);border:1px solid color-mix(in srgb,currentColor 40%,transparent);background:color-mix(in srgb,currentColor 8%,transparent);border-radius:4px;flex:0 0 auto}
/* one colour per capability, dark enough to print and read on paper */
.cap.reasoning{color:#6D28D9}.cap.vision{color:#0E7490}.cap.code{color:#1E3FD8}.cap.agent{color:#C2410C}
.cap.audio{color:#BE185D}.cap.image{color:#A16207}.cap.video{color:#B91C1C}.cap.open_weights{color:#15803D}
.cap svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.legend{display:flex;flex-wrap:wrap;gap:4px 11px;margin-top:8px;padding-top:7px;border-top:1px solid var(--ink);font-family:var(--mono);font-size:10px;line-height:20px;color:var(--graphite)}
.legend .li{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.legend .cap{width:18px;height:18px}
.legend .cap svg{width:13px;height:13px}

/* explainer */
.explain{margin-top:18px;flex:1 1 auto}
.explain .kicker{margin-top:16px}
.stand{margin-top:12px;font-size:19px;line-height:1.4;color:var(--graphite)}
.joke{margin-top:16px;padding-top:10px;border-top:1px solid var(--hair)}
.joke p{margin-top:6px;font-size:14px;line-height:1.4;color:var(--graphite);overflow-wrap:break-word}

/* page 4-5 */
.wlead{margin-top:18px;flex:1 1 auto}
.wlead .kicker{margin-top:16px}
.wreport{margin-top:18px;flex:1 1 auto}
.wreport .grid2{flex:1 1 auto;grid-template-rows:repeat(3,auto)}

/* Company actions fill p.4 and the upper half of p.5. */
.companies{margin-top:18px;flex:1 1 auto}
.companies .grid2{flex:1 1 auto;grid-template-rows:repeat(3,minmax(0,1fr))}
.companies.continued .grid2{grid-template-rows:1fr}
.companies .card .company{color:var(--ink);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.companies .card p{font-size:15px;line-height:1.45}
/* page 5 (p.6 in archived issues) */
/* markets (from markets.py; existing panel unchanged) */
.mkt{margin-top:18px}
.mkt .idx{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:16px;margin-top:14px}
.mkt .icell{display:flex;flex-direction:column;gap:4px;padding-top:8px;border-top:3px solid var(--ink)}
.mkt .icell .n{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.mkt .icell .c{font-size:34px;line-height:1;font-weight:700;letter-spacing:-.03em;white-space:nowrap}
.mkt .icell .ar{font-size:16px;margin-right:6px;vertical-align:5px}
.mkt .icell .v{font-family:var(--mono);font-size:13px;color:var(--graphite)}
.mkt .movers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px;margin-top:20px}
.mkt .mcol h3{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px}
.mkt .mcol.up h3{background:var(--accent);color:var(--on-accent)}
.mkt .mcol.down h3{background:var(--ink);color:var(--paper)}
.mkt .mrow{display:grid;grid-template-columns:96px minmax(0,1fr) auto;column-gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--hair)}
.mkt .mrow .c{font-size:24px;line-height:1;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.mkt .mcol.up .mrow .c{color:var(--up)}
.mkt .mcol.down .mrow .c{color:var(--down)}
.mkt .mrow .nm{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mkt .mrow .nm span{margin-left:6px;font-family:var(--mono);font-size:12px;font-weight:400;color:var(--graphite)}
.mkt .mrow .px{font-family:var(--mono);font-size:13px;color:var(--graphite);text-align:right}
.mkt .none{padding:9px 0;font-size:15px;color:var(--graphite)}
.mkt .note{margin-top:10px}
/* GitHub edition (two pages, read on screen): every repo name links to GitHub */
.rgrid{display:grid;grid-template-columns:28px minmax(0,1fr) 84px 56px 64px;column-gap:10px;align-items:center}
.rhead{padding:8px 0;border-bottom:1px solid var(--hair);font-family:var(--mono);font-size:12px;line-height:16px;color:var(--graphite);letter-spacing:.04em;text-transform:uppercase}
.r{text-align:right}
.ghrepos{margin-top:18px;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.ghlist{flex:1 1 auto;min-height:0;overflow:hidden}
.ghrow{display:grid;grid-template-columns:28px minmax(0,1fr) 84px 56px 64px;column-gap:10px;align-items:baseline;padding:10px 0 11px;border-bottom:1px solid var(--hair)}
.ghrow:last-child{border-bottom:0}
.ghrow .n{font-family:var(--mono);font-size:12px;color:var(--graphite)}
.ghrow .name{display:flex;align-items:baseline;min-width:0;font-family:var(--mono);line-height:18px;white-space:nowrap;overflow:hidden}
.ghrow .name span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghrow .owner{flex:0 10 auto;min-width:0;font-size:12px;color:var(--graphite)}
.ghrow .repo{flex:0 0 auto;max-width:100%;min-width:24px;font-size:15px;font-weight:600}
.ghrow a.name.lk{text-decoration:underline;text-decoration-color:var(--hair);text-decoration-thickness:1px;text-underline-offset:3px}
@media screen{.ghrow a.name.lk:hover{text-decoration-color:var(--accent);text-decoration-thickness:2px}}
.ghrow .lang{font-family:var(--mono);font-size:12px;color:var(--graphite)}
.ghrow .stars{font-family:var(--mono);font-size:14px;text-align:right}
.ghrow .gain{font-family:var(--mono);font-size:14px;font-weight:600;justify-self:end;padding:1px 5px;background:var(--accent);color:var(--on-accent)}
.ghrow .about{grid-column:2 / -1;margin-top:4px;font-size:14px;line-height:1.42}
/* New editions keep the full ranked list on page 1 and reserve page 2 for two essays. */
.ghcompact .ghrepos{margin-top:10px}
.ghcompact .rhead{padding:5px 0}
.ghcompact .ghrow{padding:.5px 0}
.ghcompact .ghrow .n,.ghcompact .ghrow .lang,.ghcompact .ghrow .stars,.ghcompact .ghrow .gain{font-size:12px;line-height:18px}
.ghcompact .ghrow .gain{padding:0 5px}
.ghcompact .ghrow .about{margin-top:1px;font-size:13px;line-height:1.2}
.ghdives{margin-top:20px;flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);column-gap:36px;row-gap:0}
.ghdive{grid-row:span 2;min-height:0;overflow:hidden;display:grid;grid-template-rows:subgrid}
.ghdive .rest{min-height:0}
.ghdives{background:linear-gradient(var(--hair),var(--hair)) center / 1px 100% no-repeat}
.ghdive h3{margin-top:10px;font-size:24px;line-height:1.12;font-weight:600;letter-spacing:-.02em}
.ghdive .intro{margin:10px 0 8px;font-size:16px;line-height:1.4;color:var(--graphite)}
.ghdive .prose p{margin-bottom:10px;font-size:14px;line-height:1.35}
.ghdive .src{margin-top:6px;font-size:11px}
/* each deep dive opens with a macOS Terminal window (dark appearance); both windows share one height */
.ghdive .win{border-radius:10px;overflow:hidden;background:#1E1E1E;color:#E6E6E6;border:.5px solid #000;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.12),0 8px 22px rgba(17,18,20,.22);font-family:var(--mono);font-size:11px;line-height:16px}
.ghdive .win .bar{position:relative;display:flex;align-items:center;height:26px;padding:0 10px;background:linear-gradient(#3B3B3D,#323234);border-bottom:.5px solid #000}
.ghdive .win .lights{display:flex;gap:8px;flex:none;position:relative;z-index:1}
.ghdive .win .lights i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.25)}
.ghdive .win .lights i:nth-child(1){background:#FF5F57}.ghdive .win .lights i:nth-child(2){background:#FEBC2E}.ghdive .win .lights i:nth-child(3){background:#28C840}
.ghdive .win .title{position:absolute;left:76px;right:12px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:-apple-system,BlinkMacSystemFont,var(--sans);font-size:11.5px;font-weight:500;color:#B5B5B7}
.ghdive .win .title a{color:#E6E6E6;font-weight:600;text-decoration:none}
.ghdive .win .title em{font-style:normal;color:var(--accent-light)}
.ghdive .win .body{padding:7px 10px 8px}
.ghdive .win .body p{overflow-wrap:anywhere}
.ghdive .win .ps{color:#8E8E93}
.ghdive .win .cm{color:#7FB27F}
.ghdive .win .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ghdive .win .cur{display:inline-block;width:7px;height:14px;margin-left:1px;vertical-align:-3px;background:#BDBDBD}
.ghdive .rest h3{margin-top:10px}
@media screen{.ghdive .win .cur{animation:blink 1.1s steps(1) infinite}}
@keyframes blink{50%{opacity:0}}

.footer-wrap{margin-top:auto;padding-top:18px;flex-shrink:0}
/* last page of each edition: the footer becomes an ink colophon band, as on the promo poster; same height as the rule-and-text footer */
.colophon footer{border-top:0;padding:6px 10px 7px;background:var(--ink);color:var(--hair);align-items:center;white-space:nowrap}
.colophon .cw{font-family:var(--sans);font-weight:600;letter-spacing:-.03em;color:var(--paper);margin-right:6px}
.colophon .cw .minicursor{background:var(--accent-light)}
/* page 1 of each edition: the promo banner's dot grid fades in behind the masthead */
.mast{position:relative}
.mast::before{content:"";position:absolute;inset:-4px 0 -6px 44%;z-index:0;pointer-events:none;background-image:radial-gradient(#B9BBBF 1.5px,transparent 1.6px);background-size:14px 14px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 35%,#000 62%,transparent 80%);mask-image:linear-gradient(90deg,transparent,#000 35%,#000 62%,transparent 80%)}
.mast>*{position:relative;z-index:1}
footer{display:flex;justify-content:space-between;gap:16px;padding-top:12px;border-top:1px solid var(--ink)}
footer .pg{padding:0 5px;background:var(--accent);color:var(--on-accent);font-weight:600}
.runhead{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.minicursor{display:inline-block;width:6px;height:11px;margin:0 3px;background:var(--accent);vertical-align:-1px}

/* magazine cover (lead.cover_summary): page 1 becomes a cover; the lead opens p.2 */
.page.cover{position:relative;padding-top:0}
.cover .panel{position:relative;margin:0 -48px;padding:40px 48px 26px;height:600px;display:flex;flex-direction:column;overflow:hidden;color:var(--paper);background:var(--accent)}
.cover .panel.photo{background:#000}
.cover .panel>.row,.cover .panel>.mast,.cover .panel>.cstory,.cover .panel>.credit{position:relative;z-index:3}
.cover .panel .row{color:#C9D2FF}.cover .panel.photo .row{color:#8A8D93}
.cover .mast h1{color:var(--paper)}
.cover .mast .issue{color:#C9D2FF}.cover .panel.photo .mast .issue{color:#8A8D93}.cover .mast .issue .ink{color:var(--paper)}
.cover .mast::before{display:none}
.cover .panel:not(.photo) .cursor{background:var(--paper)}
.cover .dots{position:absolute;inset:0;z-index:1;background-image:radial-gradient(#4A66E6 1.6px,transparent 1.7px);background-size:14px 14px;
  -webkit-mask-image:linear-gradient(200deg,#000 0%,#000 45%,transparent 80%);mask-image:linear-gradient(200deg,#000 0%,#000 45%,transparent 80%)}
.cover .photo .dots{background-image:radial-gradient(#2A2D33 1.5px,transparent 1.6px);
  -webkit-mask-image:linear-gradient(160deg,#000 0%,rgba(0,0,0,.6) 30%,transparent 55%);mask-image:linear-gradient(160deg,#000 0%,rgba(0,0,0,.6) 30%,transparent 55%)}
/* a photo fills the panel and darkens into it at the top and bottom, so the type sits on the picture */
.cover .hero{position:absolute;z-index:0;inset:0;width:100%;height:100%;object-fit:cover}
.cover .shade{position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,#000 0,rgba(0,0,0,.85) 13%,transparent 30%,transparent 52%,rgba(0,0,0,.78) 70%,#000 86%)}
/* without a photo, a ghosted company logo or the issue number fills the same space */
.cover .mark{position:absolute;z-index:1;right:-24px;top:118px;width:360px;height:360px;background:#3654E4;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:contain;mask-size:contain}
/* company marks beside each company story's label; brands without a free mark get a monogram */
.co{display:inline-flex;align-items:center;gap:5px;color:var(--ink);font-weight:600}
.co .ic{display:inline-block;width:13px;height:13px;background:currentColor;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:contain;mask-size:contain}
.co .mono{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;background:var(--ink);color:var(--paper);font:700 9px/1 var(--mono)}
.cover .numeral{position:absolute;z-index:1;right:-28px;top:178px;font:700 300px/.8 var(--mono);letter-spacing:-.06em;color:#3654E4;white-space:nowrap}
.cover .numeral::after{content:"";display:inline-block;width:.42em;height:.74em;margin-left:.06em;background:#5874EE;vertical-align:-.02em}
.cover .ghost{position:absolute;z-index:1;right:-44px;top:112px;width:600px;height:200px;background:#3654E4;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:right center;mask-position:right center;-webkit-mask-size:contain;mask-size:contain}
.cover .cstory{margin-top:auto;display:flex;flex-direction:column;max-width:560px}
.cover .photo .cstory{max-width:620px}
.cover .cstory .kicker{background:var(--paper);color:var(--accent)}
.cover .photo .cstory .kicker{background:var(--accent);color:var(--paper)}
.cover .cstory h2{margin-top:12px;font-size:52px;line-height:1.02;font-weight:600;letter-spacing:-.03em}
.cover .cstory .deck{margin-top:12px;font-size:19px;line-height:1.38;color:#DCE2FF}
.cover .photo .cstory .deck{color:#C4C6CA}
.cover .credit{position:absolute!important;right:48px;bottom:26px;font:500 10px/14px var(--mono);color:#6B6E74;letter-spacing:.04em;text-transform:uppercase}
.cover .panel:not(.photo) .credit{color:#9FB0F5}
.cover .band{margin:0 -48px;padding:8px 48px}
.cover .panel:not(.photo) + .band{background:var(--ink)}
.cover .lede{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;margin-top:18px;padding-bottom:16px;border-bottom:2px solid var(--ink)}
.cover .lede p{font-size:16px;line-height:1.45}
.cover .jump{white-space:nowrap;color:var(--ink);font-weight:600}
.cover .cpg{font-family:var(--mono);font-size:12px;font-weight:600;padding:1px 5px;background:var(--accent);color:var(--on-accent)}
.cover .lines{margin-top:16px}
.cl{display:grid;grid-template-columns:56px 64px 124px minmax(0,1fr);column-gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--hair)}
.cl:last-child{border-bottom:0}
.cl .cpg{justify-self:start}
.cl .hash{font:12px/16px var(--mono);color:#9A9DA3}
.cl .sn{font:12px/16px var(--mono);color:var(--graphite);text-transform:uppercase;letter-spacing:.04em}
.cl .hl b{display:block;font-size:16px;line-height:1.25;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl .hl i{display:block;font-style:normal;font-size:13.5px;line-height:1.35;color:var(--graphite);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cover .footer-wrap{padding-top:14px}
.cover-tech .cover-lead{margin-top:18px;flex:1 1 auto}
.cover-tech .cover-lead h2{margin-top:14px;font-size:36px}
.cover-tech .cover-lead .deck{font-size:18px}
.cover-tech .cover-lead .cols{font-size:15px;line-height:1.45}
.cover-tech .radar{margin-top:18px;flex-shrink:0}
.cover-tech .radar .grid2{grid-template-columns:repeat(4,minmax(0,1fr));column-gap:20px}
.cover-tech .radar .card{padding:10px 0 0}
.cover-tech .radar .card h3{font-size:15px;line-height:1.25}
.cover-tech .radar .card p{font-size:13px;line-height:1.38}
.cover-tech .briefs .card.wide p{column-count:2;column-gap:40px;column-rule:1px solid var(--hair)}
.cover-tech .briefs .card.wide{flex:0 0 auto}
.cover-tech .briefs .card p{font-size:15.5px;line-height:1.48}

/* links keep the printed look; on screen they show on hover */
a.lk{color:inherit;text-decoration:none}
@media screen{a.lk:hover{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:2px}}

  "headline": "Apple brings touch and OLED to MacBook Pro",
  "deck": "The new professional laptops combine a different display architecture with touch controls, with US prices starting at $2,899.",
  "cover_summary": "Apple’s new 14- and 16-inch laptops arrive November 6. Their stacked OLED layers share the work of producing light, while a display engine compensates for changes in individual pixels.",
  "source": {
   "name": "apple.com",
   "url": "https://www.apple.com/newsroom/2026/10/apple-unveils-groundbreaking-macbook-pro-with-proled-xdr-display/"
  },
  "author": "Apple",
  "read_minutes": 26,
  "paragraphs": [
   "Apple has introduced 14- and 16-inch MacBook Pro models with a tandem OLED display and the first touch capabilities on a Mac. Preorders opened October 28, with availability beginning November 6. US prices start at $2,899 for the 14-inch M5 Pro model and $3,399 for its 16-inch counterpart. M5 Max configurations are also available.",
   "The display’s two light-emitting layers share the work, allowing each to operate at lower current. Apple says this improves brightness, efficiency and lifespan. Its supplied technical paper specifies 1,000 nits of sustained full-screen brightness in environments up to 25°C, alongside peaks of 2,000 nits. Sustained and peak output are different measures.",
   "A new display engine continuously compensates for usage, temperature and changing pixel performance. Apple describes this as burn-in mitigation, rather than a guarantee against ageing. Touch also brings direct interaction to creative applications, including playing onscreen instruments in Logic Pro. For buyers doing colour-sensitive work, the calibration and uniformity claims will matter alongside the new controls."
  ]
 },

    "Google has announced Gemini 4 Carbon, which it calls its strongest model, but most people cannot use it yet. Starting this week, access goes to a subset of cyber defenders, with more trusted partners to follow through the company's Fairwind Program.",
    "Google links the cautious rollout to the model's security abilities. It reports state-of-the-art scores of 88.2% for finding vulnerabilities on SEC-bench Pro, 54.8% for exploitation on ExploitGym and 71.0% for patching on CWE-bench. Carbon also ranks first on version 5.0 of the Artificial Analysis Intelligence Index, at 59.",
    "The company is taking part in the US government's voluntary process for testing models before release. It says it will keep gathering feedback and adjusting guardrails before offering Carbon to developers, businesses and consumers.",
    "Google also says Carbon is built for long engineering tasks: its teams have seen it work for days on subtle bugs across large codebases. In internal testing, the company reports that Carbon roughly halves unsupported claims compared with Argon.",
    "These are Google's own measurements. Until access widens, outside users cannot check whether the results hold up in everyday security work, and Google has given no date for general availability."

 "explainer": {
  "topic": "Browser fingerprinting",
  "headline": "A suspicious script needs more than a name",
  "standfirst": "Browser fingerprinting uses rendering differences to distinguish devices. A reverse-engineering account shows why alarming code labels require careful interpretation.",
  "source": {
   "name": "nullpt.rs",
   "url": "https://nullpt.rs/fingerprinting-bioweapons"
  },
  "author": "nullpt.rs",
  "published": "2026-10-28",
  "read_minutes": 3,
  "paragraphs": [
   "A researcher investigating browser fingerprinting found an unusually obscured script and published an account with a provocative question about bioweapons. The supplied text supports a narrower explanation: this was an investigation of browser identification and misleading code. It does not establish that a website created a biological weapon, or that an alarming name describes what software actually does.",
   "Canvas fingerprinting begins with an ordinary browser feature: drawing text, shapes or other graphics onto a canvas. The script then extracts the resulting pixels. Browsers, operating systems, graphics drivers and hardware can render the same instructions slightly differently. Those differences can help distinguish one browser environment from another. The useful signal is in the rendered result, rather than simply the words or shapes being drawn.",
   "To find examples, the author crawled sites from the Tranco Top Sites list using Playwright. The crawler intercepted calls that extract canvas images and checked properties associated with fingerprinting or bot detection, including navigator.webdriver. The author collected examples at fingerprint.garden, finding familiar fingerprinting products as well as the script that prompted this investigation.",
   "The account identifies a script hosted at servicepipe.tech and says its variable names appeared intended to mislead language-model-assisted analysis. The author asked Astra to examine it with that possibility in mind. The text also describes apparently malicious code gated behind an environment flag when running under Node. The supplied excerpt does not establish that this branch executed in visitors’ browsers.",
   "The author’s overall assessment is that, beyond its unusual obfuscation, the script appears to be a standard anti-bot script. That leaves a useful distinction for readers: evidence of fingerprinting, interpretation of misleading names, and proof of harmful execution are separate questions. This account gives an explanation of the first and reasons to investigate the others carefully."
  ]

  {
   "full_name": "debpalash/VoiceStudio",
   "headline": "A voice production desk on your device",
   "standfirst": "VoiceStudio brings multiple speech tasks and model engines into a local application, with different support levels across platforms.",
   "why_selected": "Combines voice creation, transcription and dubbing in one locally run workspace.",
   "paragraphs": [
    "VoiceStudio aims to put speech production on the user’s device. Its documented tasks include cloning a voice from a clean reference recording, designing a voice from a written description, dubbing video, dictating text and narrating audiobooks. The project claims support for 646 languages. Its appeal is the combination of tasks in one workspace, rather than a single speech generator requiring a separate application for each subsequent step.",
    "The default engine uses OmniVoice, but a model manager lets users choose other engines and download only the models they need. The application asks before downloading a model. For repeated work, the README describes queued jobs, watch folders, reusable recipes and a local programming interface. These features connect individual voice experiments to longer production workflows, such as batch narration or repeated processing of incoming files.",
    "Platform support needs careful reading. The project lists Apple Silicon macOS, Windows, Linux and Docker as stable; Android and iPhone versions are previews. Intel Macs provide the interface while connecting to a remote backend. The README says CPU operation is possible but slower, with acceleration varying by platform and engine. These are documentation claims, not our performance measurements. Buyers of the idea should therefore check their intended engine and device before assuming the same experience across all supported systems."
   ]
  },
  {
   "full_name": "strelov1/freehire",
   "headline": "Job search with an inspectable supply chain",
   "standfirst": "Freehire combines vacancy collection with application tools, while its source breakdown complicates the promise of jobs straight from employers.",
   "why_selected": "Links vacancy ingestion, deduplication and application tracking in a self-hostable project.",
   "paragraphs": [
    "Freehire is a job search engine with tools that go beyond finding vacancies. Its README lists saved searches, email and Telegram digests, a CV builder, application tracking and an inbox that links recruiter replies to applications. It is MIT-licensed and can be self-hosted. A public interface lets other apps query the catalogue without a key, making the data useful to job seekers and people building search tools.",
    "The pipeline fetches listings, puts them in a common format and merges reposts using a stable key. Search filters cover region, work mode, seniority, skills and salary. The README says these come from curated dictionaries rather than guesses. Separate workers handle crawling, enrichment, indexing and alerts, while the web server serves the interface for accessing their work.",
    "The source breakdown needs care. The introduction promises jobs straight from company career pages, but the detailed list includes aggregators, job boards and Telegram channels. The claim of over 3.3 million postings is therefore no guarantee of an exclusively direct-employer collection. The project exposes both this mix and its data pipeline. Some features need optional language-model credentials; they stay disabled when those are absent. We have not tested listing freshness, matching quality or the application tools."
   ]
  }
